name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Determine version
        run: |
          THEME_VERSION="$(grep -m1 '^Version:' style.css | awk '{print $2}')"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            TAG="$GITHUB_REF_NAME"
            if [ "${TAG#v}" != "$THEME_VERSION" ]; then
              echo "::error::Tag $TAG does not match style.css Version $THEME_VERSION"
              exit 1
            fi
          else
            # Manual run: tag is derived from style.css and created by the release step.
            TAG="v$THEME_VERSION"
          fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "VERSION=$THEME_VERSION" >> "$GITHUB_ENV"

      - name: Build theme ZIP
        run: |
          mkdir -p build/naturaly
          git ls-files \
            | grep -v -E '^(\.github/|README\.md$|\.gitignore$|\.gitattributes$)' \
            | xargs -I{} cp --parents {} build/naturaly/
          (cd build && zip -r -q ../naturaly.zip naturaly)
          unzip -l naturaly.zip

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" naturaly.zip \
            --target "$GITHUB_SHA" \
            --title "Naturaly $VERSION" \
            --notes "Installation: \`naturaly.zip\` herunterladen und in WP-Admin unter *Design → Themes → Theme hinzufügen → Theme hochladen* installieren."
